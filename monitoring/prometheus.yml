global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - prometheus.rules.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'event-producer'
    static_configs:
      - targets: ['event-producer:8001']

  - job_name: 'feature-consumer'
    static_configs:
      - targets: ['feature-consumer:8002']

  - job_name: 'inference-api'
    scrape_interval: 10s
    static_configs:
      - targets: ['inference-api:8000']
    metrics_path: /metrics

  - job_name: 'visualization'
    static_configs:
      - targets: ['visualization:8003']
    metrics_path: /metrics

  - job_name: 'rider-app'
    static_configs:
      - targets: ['rider-app:8004']
    metrics_path: /metrics
